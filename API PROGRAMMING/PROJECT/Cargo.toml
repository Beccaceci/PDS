[package]
name = "georuggine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
sqlite = "0.37"
bcrypt = "0.15"
chrono = "0.4"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"     # Optimize for minimum binary executable size
lto = true          # Link-Time Optimization (removes dead code across all crates)
codegen-units = 1   # Maximize LTO optimization level
panic = "abort"     # Remove stack unwinding tables on panic to save binary space
strip = true        # Automatically strip debug symbols (Rust 1.59+)
